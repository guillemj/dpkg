name: OpenBSD test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test dpkg on OpenBSD
    steps:
    - uses: actions/checkout@v4
    - name: Test in OpenBSD
      id: test
      uses: vmactions/openbsd-vm@v1
      env:
        AUTOCONF_VERSION: 2.72
        AUTOMAKE_VERSION: 1.18
        MAKE: gmake
        LDFLAGS: -L/usr/local/lib
        CPPFLAGS: -isystem /usr/local/include
      with:
        envs: 'AUTOCONF_VERSION AUTOMAKE_VERSION MAKE LDFLAGS CPPFLAGS'
        usesh: true
        copyback: false
        prepare: |
          pkg_add libtool autoconf--%2.72 automake--%1.18 gettext-tools gettext-runtime gtar-- gpatch gmake

        run: |
          ./.github/actions/ci-configure
          ./.github/actions/ci-test
